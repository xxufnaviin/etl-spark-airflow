services:
  init-db:
    image: etl-spark-airflow:263.310.4
    command: >
      bash -c "
      airflow db init &&\
      airflow users create --username admin --password admin123 --firstname Admin --lastname User --role Admin --email admin@example.org
      "
    volumes:
      - ./airflow:/opt/airflow

  scheduler:
    image: etl-spark-airflow:263.310.4
    command: scheduler
    env_file: .env
    depends_on:
      init-db:
        condition: service_completed_successfully
    volumes:
      - ./airflow:/opt/airflow
      - ./jobs:/opt/jobs
      - ./utils:/opt/utils
      - ./data:/opt/airflow/data
    environment:
      PYTHONPATH: /opt:$PYTHONPATH

  webserver:
    image: etl-spark-airflow:263.310.4
    command: webserver
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      init-db:
        condition: service_completed_successfully
    volumes:
      - ./airflow:/opt/airflow